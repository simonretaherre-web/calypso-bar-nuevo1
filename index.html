
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Descubre la carta de cócteles de CALYPSO BAR.">
  <title>CALYPSO BAR | Carta de cócteles</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #080808;
      --panel: #111111;
      --panel-light: #191919;
      --gold: #d4af62;
      --gold-light: #f0d99a;
      --text: #f5f0e6;
      --muted: #b7ad9b;
      --border: rgba(212,175,98,.32);
      --green: #9bc9a1;
      --red: #e2a29a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #20190d 0, transparent 42%),
        var(--black);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 19px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 15px 5%;
    }

    .mode-link {
      color: var(--gold);
      text-decoration: none;
      font-size: 17px;
      letter-spacing: 1px;
    }

    .mode-link:hover {
      color: var(--gold-light);
    }

    .hero {
      text-align: center;
      padding: 8px 20px 24px;
    }

    .logo {
      display: block;
      width: min(230px, 68vw);
      max-height: 230px;
      object-fit: contain;
      margin: 0 auto 12px;
    }

    .brand {
      color: var(--gold);
      font-family: "Cinzel", serif;
      font-size: clamp(27px, 6vw, 42px);
      font-weight: 500;
      letter-spacing: 5px;
      margin: 0;
    }

    .tagline {
      color: var(--muted);
      margin: 7px 0 0;
      letter-spacing: 2px;
      font-size: 17px;
    }

    .gold-line {
      width: min(230px, 60%);
      height: 1px;
      margin: 22px auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    main {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding-bottom: 45px;
    }

    .intro {
      text-align: center;
      margin: 0 auto 22px;
    }

    h2, h3 {
      font-family: "Cinzel", serif;
      font-weight: 500;
    }

    .intro h2 {
      color: var(--gold-light);
      font-size: clamp(23px, 5vw, 30px);
      margin: 0 0 8px;
    }

    .intro p {
      color: var(--muted);
      margin: 0;
    }

    .recommend-button {
      display: block;
      width: 100%;
      max-width: 410px;
      margin: 22px auto;
      padding: 15px 18px;
      color: var(--black);
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      border: 1px solid var(--gold);
      border-radius: 8px;
      font-family: "Cinzel", serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: .5px;
      box-shadow: 0 5px 22px rgba(212,175,98,.10);
    }

    .recommend-button:hover {
      filter: brightness(1.08);
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0;
    }

    .filter-button {
      padding: 11px 18px;
      color: var(--gold-light);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      transition: .2s;
    }

    .filter-button:hover,
    .filter-button.active {
      color: var(--black);
      background: var(--gold);
      border-color: var(--gold);
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(130px, .35fr);
      gap: 12px;
      margin: 20px 0;
    }

    .field {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
    }

    .field::placeholder {
      color: #938a7a;
    }

    .field option {
      color: var(--text);
      background: var(--panel);
    }

    .results-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 28px 0 15px;
    }

    .results-heading h2 {
      margin: 0;
      color: var(--gold-light);
      font-size: 23px;
    }

    .results-count {
      color: var(--muted);
      font-size: 16px;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat( auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 18px;
    }

    .recipe-card {
      min-width: 0;
      overflow: hidden;
      background: linear-gradient(145deg, #171717, #0d0d0d);
      border: 1px solid var(--border);
      border-radius: 11px;
      box-shadow: 0 8px 26px rgba(0,0,0,.22);
    }

    .recipe-photo {
      width: 100%;
      height: 330px;
      display: block;
      object-fit: contain;
      object-position: center;
      background: #080808;
      border-bottom: 1px solid var(--border);
    }

    .photo-placeholder {
      height: 330px;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 43px;
      background:
        radial-gradient(circle, rgba(212,175,98,.12), transparent 68%),
        #111;
      border-bottom: 1px solid var(--border);
    }

    .recipe-body {
      padding: 16px;
    }

    .recipe-title {
      margin: 0 0 8px;
      color: var(--gold-light);
      font-size: 27px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 17px;
    }

    .tag.alcohol {
      color: #f0c4a8;
      border-color: rgba(226,162,154,.45);
    }

    .tag.no-alcohol {
      color: var(--green);
      border-color: rgba(155,201,161,.45);
    }

    .recipe-section-title {
      color: var(--gold);
      margin: 15px 0 7px;
      font-family: "Cinzel", serif;
      font-size: 17px;
      letter-spacing: .4px;
    }

    .ingredient-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .ingredient-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 19px;
    }

    .ingredient-name {
      overflow-wrap: anywhere;
    }

    .ingredient-amount {
      flex-shrink: 0;
      color: var(--gold-light);
      text-align: right;
    }

    .no-ingredients {
      color: var(--muted);
      font-size: 16px;
      margin: 5px 0;
    }

    .empty-state,
    .status-box {
      padding: 24px 18px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
    }

    .empty-state h3 {
      color: var(--gold-light);
      margin-top: 0;
    }

    .status-box {
      margin: 15px 0;
      padding: 12px;
      font-size: 16px;
    }

    .status-box.error {
      color: var(--red);
      border-color: rgba(226,162,154,.4);
    }

    .status-box.success {
      color: var(--green);
      border-color: rgba(155,201,161,.4);
    }

    .footer {
      padding: 24px 15px;
      text-align: center;
      color: #8f8574;
      border-top: 1px solid var(--border);
      font-size: 16px;
      letter-spacing: 1px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.82);
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
    }

    .modal-panel {
      width: min(500px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
      background: #111;
      border: 1px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 15px 60px rgba(0,0,0,.6);
    }

    .modal-panel h2 {
      margin: 0 0 8px;
      color: var(--gold-light);
      font-size: 25px;
    }

    .modal-description {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .form-label {
      display: block;
      margin: 15px 0 6px;
      color: var(--gold-light);
      font-size: 17px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .modal-actions button {
      flex: 1;
      min-width: 130px;
      min-height: 47px;
      padding: 10px;
      border-radius: 7px;
      border: 1px solid var(--gold);
    }

    .primary-button {
      color: var(--black);
      background: var(--gold);
    }

    .secondary-button {
      color: var(--gold-light);
      background: transparent;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 13px 5%;
      }

      .hero {
        padding-top: 0;
      }

      .logo {
        width: min(190px, 60vw);
      }

      .brand {
        letter-spacing: 3px;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .filter-button {
        padding: 10px 5px;
        font-size: 16px;
      }

      .recipe-photo {
        height: 290px;
      }

      .photo-placeholder {
        height: 290px;
      }

      .modal-panel {
        padding: 18px;
      }
    }
  
    /* Tipografía más gruesa y legible en móviles */
    body { font-weight: 500; }
    h1, h2, h3, h4, .brand, .recommend-button, .mode-link,
    .filter-button, .category-button, .recipe-name, .recipe-title,
    button, label, strong, b {
      font-weight: 700;
    }
    p, li, .tagline, .muted, .recipe-description, .ingredient,
    .recipe-meta, .filter-label, input, select {
      font-weight: 600;
    }
    .mode-link, .tagline, .muted { text-shadow: 0 0 .01px currentColor; }
</style>
</head>

<body>
  <header>
    <div class="topbar">
      <a class="mode-link" href="./admin.html">Cambiar modo</a>
    </div>

    <div class="hero">
      <img
        class="logo"
        src="./logo-calypso.png"
        alt="Logo CALYPSO BAR"
        onerror="this.style.display='none'"
      >
      <h1 class="brand">CALYPSO BAR</h1>
      <p class="tagline">Coctelería · Sabor · Elegancia</p>
      <div class="gold-line"></div>
    </div>
  </header>

  <main>
    <section class="intro">
      <h2>Descubre tu próximo cóctel</h2>
      <p>Encuentra una opción para tu gusto.</p>
    </section>

    <button class="recommend-button" id="openRecommend" type="button">
      ¿Qué puedo tomar?
    </button>

    <div id="connectionStatus" class="status-box" role="status">
      Conectando con la carta...
    </div>

    <nav class="filters" aria-label="Filtrar cócteles">
      <button class="filter-button active" data-filter="todos" type="button">Todos</button>
    </nav>

    <div class="search-row">
      <input
        class="field"
        id="searchInput"
        type="search"
        placeholder="Buscar por cóctel, ingrediente o categoría..."
        aria-label="Buscar cócteles"
      >


    </div>

    <div class="results-heading">
      <h2 id="resultsTitle">Nuestra carta</h2>
      <span class="results-count" id="resultsCount"></span>
    </div>

    <section id="recipeGrid" class="recipe-grid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    CALYPSO BAR · Coctelería · Sabor · Elegancia
  </footer>

  <!-- Ventana de recomendaciones -->
  <div class="modal" id="recommendModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <h2 id="modalTitle">¿Qué puedo tomar?</h2>
      <p class="modal-description" id="modalDescription">
        Encontraremos opciones de la carta con alcohol.
      </p>

      <div id="typeStep">

        <div class="modal-actions">
          <button class="secondary-button" id="closeModal" type="button">Cancelar</button>
          <button class="primary-button" id="continueRecommend" type="button">Continuar</button>
        </div>
      </div>

      <div id="preferencesStep" class="hidden">
        <label class="form-label" for="flavorSelect">¿Qué sabor te gusta?</label>
        <select class="field" id="flavorSelect">
          <option value="cualquiera">Cualquiera</option>
          <option value="dulce">Dulce</option>
          <option value="muy dulce">Muy dulce</option>
          <option value="cítrico">Cítrico</option>
          <option value="amargo">Amargo</option>
          <option value="frutal">Frutal</option>
          <option value="refrescante">Refrescante</option>
          <option value="especiados">Especiados</option>
        </select>

        <label class="form-label" for="spiritSelect">¿Qué destilado prefieres?</label>
        <select class="field" id="spiritSelect">
          <option value="cualquiera">Cualquiera</option>
          <option value="ron">Ron</option>
          <option value="vodka">Vodka</option>
          <option value="gin">Gin</option>
          <option value="tequila">Tequila</option>
          <option value="whisky">Whisky</option>
          <option value="sin destilado">Sin destilado específico</option>
        </select>

        <label class="form-label" for="strengthSelect">Intensidad</label>
        <select class="field" id="strengthSelect">
          <option value="cualquiera">Cualquiera</option>
          <option value="suave">Suave</option>
          <option value="media">Media</option>
          <option value="fuerte">Fuerte</option>
        </select>

        <div class="modal-actions">
          <button class="secondary-button" id="backToType" type="button">Atrás</button>
          <button class="primary-button" id="showRecommendations" type="button">Ver opciones</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import {
      collection,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const grid = document.getElementById("recipeGrid");
    const statusBox = document.getElementById("connectionStatus");
    const searchInput = document.getElementById("searchInput");
    const resultsCount = document.getElementById("resultsCount");
    const resultsTitle = document.getElementById("resultsTitle");

    const modal = document.getElementById("recommendModal");
    const typeStep = document.getElementById("typeStep");
    const preferencesStep = document.getElementById("preferencesStep");

    let recipes = [];
    let currentFilter = "todos";
    let recommendation = null;
    let activeRecommendation = false;

    function text(value) {
      return value == null ? "" : String(value).trim();
    }

    function normalizeType(value) {
      const v = text(value).toLowerCase();

      if (
        v === "con" ||
        v === "alcohol" ||
        v === "con alcohol" ||
        v === "true" ||
        v === "yes"
      ) return "con";

      if (
        v === "sin" ||
        v === "sin alcohol" ||
        v === "no alcohol" ||
        v === "false" ||
        v === "no"
      ) return "sin";

      return "";
    }

    function recipeType(recipe) {
      const directType = normalizeType(recipe.type);

      if (directType) return directType;

      if (typeof recipe.alcohol === "boolean") {
        return recipe.alcohol ? "con" : "sin";
      }

      if (typeof recipe.alcohol === "string") {
        const parsed = normalizeType(recipe.alcohol);
        if (parsed) return parsed;
      }

      return "sin";
    }

    function normalizeIngredient(ingredient) {
      if (typeof ingredient === "string") {
        return { name: ingredient, amount: "", unit: "" };
      }

      if (!ingredient || typeof ingredient !== "object") {
        return { name: "", amount: "", unit: "" };
      }

      return {
        name: text(ingredient.name || ingredient.ingredient),
        amount: text(ingredient.amount || ingredient.quantity),
        unit: text(ingredient.unit)
      };
    }

    function normalizeVariant(variant, fallbackRecipe) {
      const source = variant || {};
      const type = normalizeType(source.type) || recipeType(fallbackRecipe);

      const ingredients = Array.isArray(source.ingredients)
        ? source.ingredients.map(normalizeIngredient).filter(item => item.name)
        : Array.isArray(fallbackRecipe.ingredients)
          ? fallbackRecipe.ingredients.map(normalizeIngredient).filter(item => item.name)
          : [];

      return {
        id: text(source.id) || type,
        type,
        ingredients,
        published: source.published !== false,
        flavors: Array.isArray(source.flavors)
          ? source.flavors.map(v => text(v).toLowerCase()).filter(Boolean)
          : [],
        spirit: text(source.spirit).toLowerCase(),
        strength: text(source.strength).toLowerCase()
      };
    }

    function expandRecipe(recipe, documentId) {
      const base = {
        ...recipe,
        id: documentId,
        name: text(recipe.name) || "Cóctel sin nombre",
        category: text(recipe.category) || "Otros",
        photo: text(recipe.photo || recipe.image || recipe.imageUrl)
      };

      if (Array.isArray(recipe.variants) && recipe.variants.length) {
        return recipe.variants
          .filter(variant => variant && variant.published !== false)
          .map(variant => {
            const normalized = normalizeVariant(variant, recipe);

            return {
              id: `${documentId}-${normalized.id}`,
              parentId: documentId,
              name: base.name,
              category: base.category,
              photo: base.photo,
              story: text(base.story),
              type: normalized.type,
              ingredients: normalized.ingredients,
              flavors: normalized.flavors,
              spirit: normalized.spirit,
              strength: normalized.strength
            };
          });
      }

      // Compatibilidad con recetas guardadas en el formato antiguo.
      if (recipe.published === false) return [];

      return [{
        id: documentId,
        parentId: documentId,
        name: base.name,
        category: base.category,
        photo: base.photo,
        story: text(base.story),
        type: recipeType(recipe),
        ingredients: Array.isArray(recipe.ingredients)
          ? recipe.ingredients.map(normalizeIngredient).filter(item => item.name)
          : [],
        flavors: Array.isArray(recipe.flavors)
          ? recipe.flavors.map(v => text(v).toLowerCase()).filter(Boolean)
          : [],
        spirit: text(recipe.spirit).toLowerCase(),
        strength: text(recipe.strength).toLowerCase()
      }];
    }

    function formatAmount(ingredient, servings) {
      const amount = text(ingredient.amount);
      const originalUnit = text(ingredient.unit);
      // En la carta pública se omite la etiqueta "ml", pero se conservan
      // las cantidades y las demás unidades de medida.
      const unit = /^ml$/i.test(originalUnit) ? "" : originalUnit;

      if (!amount) return unit || "";

      const numericAmount = Number(amount.replace(",", "."));

      if (!Number.isFinite(numericAmount)) {
        return [amount, unit].filter(Boolean).join(" ");
      }

      const scaled = numericAmount * servings;
      const cleanNumber = Number(scaled.toFixed(3)).toString();

      return [cleanNumber, unit].filter(Boolean).join(" ");
    }

    function escapeHtml(value) {
      return text(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function matchesSearch(recipe, query) {
      if (!query) return true;

      const searchable = [
        recipe.name,
        recipe.category,
        recipe.type === "con" ? "con alcohol" : "sin alcohol",
        ...(recipe.ingredients || []).map(item => item.name)
      ].join(" ").toLowerCase();

      return searchable.includes(query);
    }

    function matchesRecommendation(recipe) {
      if (!activeRecommendation || !recommendation) return true;
      if (recipe.type !== recommendation.type) return false;


      const flavor = recommendation.flavor;
      const spirit = recommendation.spirit;
      const strength = recommendation.strength;

      if (flavor !== "cualquiera") {
        const recipeFlavors = (recipe.flavors || []).map(item => String(item).toLowerCase());
        const searchableRecipe = [
          recipe.name || "",
          recipe.story || "",
          ...(recipe.ingredients || []).map(item => item.name || "")
        ].join(" ").toLowerCase();
        const matchesFlavor = flavor === "especiados"
          ? recipeFlavors.some(item => item.includes("especiad") || item.includes("especia")) ||
            /canela|jengibre|clavo|cardamomo|nuez moscada|an[ií]s|pimienta|especiad/.test(searchableRecipe)
          : recipeFlavors.some(item => item.includes(flavor));
        if (!matchesFlavor) return false;
      }

      if (
        spirit !== "cualquiera" &&
        spirit !== "sin destilado" &&
        !recipe.spirit.includes(spirit)
      ) return false;

      if (
        spirit === "sin destilado" &&
        recipe.spirit &&
        recipe.spirit !== "ninguno" &&
        recipe.spirit !== "sin destilado"
      ) return false;

      if (
        strength !== "cualquiera" &&
        recipe.strength !== strength
      ) return false;

      return true;
    }

    function getRecipeStrength(recipe) {
      const saved = text(recipe.strength).toLowerCase().trim();
      if (["suave", "media", "medio", "fuerte"].includes(saved)) {
        return saved === "medio" ? "Media" : saved.charAt(0).toUpperCase() + saved.slice(1);
      }

      // Si una receta antigua no tiene intensidad guardada, mostrar una estimación
      // conservadora basada en el tipo de bebida, sin cambiar sus datos en Firestore.
      if (recipe.type === "sin") return "Suave";
      const ingredientText = (recipe.ingredients || [])
        .map(item => String(item.name || "").toLowerCase())
        .join(" ");
      if (/vodka|ron|gin|ginebra|tequila|whisky|whiskey|bourbon|aguardiente|pisco/.test(ingredientText)) {
        return "Media (estimada)";
      }
      return "Media (estimada)";
    }

    // Ilustraciones locales para los 19 mocktails: no dependen de enlaces externos.
    // Se usan solo en bebidas marcadas como sin alcohol; no modifica recetas ni fotos guardadas.
    function mocktailIllustration(recipe) {
      if (recipe.type !== "sin") return "";
      const key = String(recipe.name || "").trim().toLocaleLowerCase("es");
      const palette = {
        "shirley temple": ["#c9234a", "#ffb0b8", "cherry"],
        "mojito sin alcohol": ["#8cbf62", "#d7efaa", "lime"],
        "arnold palmer": ["#b87935", "#f5d29b", "lemon"],
        "piña colada sin alcohol": ["#e9d8a6", "#fff1ce", "pineapple"],
        "virgin mary": ["#c74c3d", "#f3a08e", "celery"],
        "roy rogers": ["#8c2434", "#e7a0a0", "cherry"],
        "cinderella": ["#e98c39", "#ffd39a", "orange"],
        "margarita sin alcohol": ["#9acb65", "#e0f3b0", "lime"],
        "mule de jengibre sin alcohol": ["#d59a43", "#f5d5a0", "lime"],
        "paloma sin alcohol": ["#ee9a9b", "#ffd0c4", "grapefruit"],
        "sunrise sin alcohol": ["#e66e35", "#ffca59", "orange"],
        "lime rickey sin alcohol": ["#8acb75", "#d6f0b5", "lime"],
        "limonana": ["#a9d47b", "#e7f5bb", "mint"],
        "chicha morada sin fermentar": ["#713d91", "#c4a0e5", "lime"],
        "mote con huesillo sin alcohol añadido": ["#c77a36", "#f2c184", "peach"],
        "pepino y menta cooler": ["#65b58c", "#c7f0d5", "cucumber"],
        "cherry lime rickey sin alcohol": ["#c83e59", "#f6a2b5", "cherry"],
        "daiquiri de frutilla sin alcohol": ["#d74768", "#ffb5c3", "strawberry"],
        "coconut kiss": ["#d5c6a6", "#fff3d8", "pineapple"]
      };
      const match = palette[key];
      if (!match) return "";
      const [drink, light, garnish] = match;
      const fruit = garnish === "lime"
        ? '<circle cx="229" cy="103" r="18" fill="#7ba94a" stroke="#d9ed9c" stroke-width="4"/><path d="M229 87V119M213 103H245M218 92L240 114M240 92L218 114" stroke="#eaf6c8" stroke-width="2"/>'
        : garnish === "cherry"
        ? '<circle cx="225" cy="101" r="12" fill="#c92e48"/><path d="M225 90Q223 73 238 72" fill="none" stroke="#9ec56a" stroke-width="4"/>'
        : garnish === "orange" || garnish === "grapefruit" || garnish === "lemon"
        ? '<circle cx="225" cy="102" r="19" fill="#f0b64d" stroke="#fff0bf" stroke-width="4"/><path d="M225 85V119M208 102H242M213 90L237 114M237 90L213 114" stroke="#fff0bf" stroke-width="2"/>'
        : garnish === "cucumber"
        ? '<ellipse cx="225" cy="101" rx="13" ry="23" fill="#77b987" stroke="#d4f0bf" stroke-width="4"/><ellipse cx="225" cy="101" rx="5" ry="14" fill="#dff1b9"/>'
        : garnish === "strawberry"
        ? '<path d="M210 89Q225 77 240 89L236 108Q225 127 214 108Z" fill="#e64e6b"/><path d="M214 87L209 80L222 84L230 78L235 86" fill="#83ad53"/>'
        : garnish === "pineapple"
        ? '<path d="M210 89L225 78L240 89L236 111L214 111Z" fill="#eabf56" stroke="#fff0bf" stroke-width="3"/><path d="M225 78L220 68L228 75L236 66L233 81" fill="#7ea95d"/>'
        : '<path d="M208 92Q222 76 236 91Q223 104 208 92Z" fill="#80b96b"/><path d="M218 88L230 96" stroke="#e7f3c9" stroke-width="2"/>';
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240"><defs><linearGradient id="drink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="' + light + '"/><stop offset="1" stop-color="' + drink + '"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient></defs><rect width="320" height="240" rx="18" fill="#0b0b0b"/><circle cx="160" cy="120" r="91" fill="none" stroke="#d4af62" stroke-opacity=".28"/><ellipse cx="157" cy="204" rx="72" ry="9" fill="#000" opacity=".45"/><path d="M105 63L119 183Q157 197 195 183L209 63Z" fill="url(#glass)" stroke="#e4d8b8" stroke-width="3"/><path d="M112 91L122 177Q157 189 192 177L202 91Z" fill="url(#drink)" opacity=".95"/><path d="M105 63Q157 75 209 63" fill="none" stroke="#fff6df" stroke-width="4"/><path d="M123 79L135 169" stroke="#fff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/><circle cx="144" cy="111" r="5" fill="#fff" opacity=".35"/><circle cx="176" cy="142" r="4" fill="#fff" opacity=".3"/>' + fruit + '<path d="M80 38L87 52L101 59L87 66L80 80L73 66L59 59L73 52Z" fill="#d4af62" opacity=".85"/><path d="M244 161L249 171L259 176L249 181L244 191L239 181L229 176L239 171Z" fill="#d4af62" opacity=".65"/><path d="M133 214H187" stroke="#d4af62" stroke-width="2" stroke-linecap="round"/></svg>';
      return "data:image/svg+xml," + encodeURIComponent(svg);
    }

    function createCard(recipe) {
      // La carta pública siempre muestra cantidades para una sola porción.
      const servings = 1;
      const alcoholTag = recipe.type === "con"
        ? '<span class="tag alcohol">Con alcohol</span>'
        : '<span class="tag no-alcohol">Sin alcohol</span>';

      const strengthTag = `<span class="tag">${escapeHtml(getRecipeStrength(recipe))}</span>`;

      const categoryTag = recipe.category
        ? `<span class="tag">${escapeHtml(recipe.category)}</span>`
        : "";

      const mocktailPhoto = mocktailIllustration(recipe);
      const displayPhoto = mocktailPhoto || recipe.photo;
      const photoMarkup = displayPhoto
        ? `<img class="recipe-photo" src="${escapeHtml(displayPhoto)}" alt="${escapeHtml(recipe.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')">
           <div class="photo-placeholder hidden" aria-hidden="true">✦</div>`
        : '<div class="photo-placeholder" aria-hidden="true">✦</div>';

      const ingredientsMarkup = recipe.ingredients.length
        ? `<ul class="ingredient-list">
            ${recipe.ingredients.map(ingredient => `
              <li>
                <span class="ingredient-name">${escapeHtml(ingredient.name)}</span>
              </li>
            `).join("")}
          </ul>`
        : '<p class="no-ingredients">Los ingredientes aún no están disponibles.</p>';

      return `
        <article class="recipe-card">
          ${photoMarkup}
          <div class="recipe-body">
            <h3 class="recipe-title">${escapeHtml(recipe.name)}</h3>
            <div class="recipe-meta">${alcoholTag}${strengthTag}${categoryTag}</div>
            ${recipe.story ? `<p class="recipe-story">${escapeHtml(recipe.story)}</p>` : ""}
            <div class="recipe-section-title">
              Ingredientes · ${servings} ${servings === 1 ? "porción" : "porciones"}
            </div>
            ${ingredientsMarkup}
          </div>
        </article>
      `;
    }

    function getVisibleRecipes() {
      const query = text(searchInput.value).toLowerCase();

      return recipes.filter(recipe => {
        if (currentFilter !== "todos" && recipe.type !== currentFilter) {
          return false;
        }

        if (!matchesSearch(recipe, query)) return false;
        if (!matchesRecommendation(recipe)) return false;

        return true;
      });
    }

    function renderRecipes() {
      const visible = getVisibleRecipes();

      resultsCount.textContent =
        `${visible.length} ${visible.length === 1 ? "opción" : "opciones"}`;

      if (activeRecommendation) {
        resultsTitle.textContent = "Opciones para ti";
      } else {
        resultsTitle.textContent = "Nuestra carta";
      }

      if (!visible.length) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <h3>No encontramos cócteles</h3>
            <p>
              Puede que no haya cócteles publicados con ese nombre o ingrediente,
              o que debas probar otra búsqueda.
            </p>
          </div>
        `;
        return;
      }

      grid.innerHTML = visible.map(createCard).join("");
    }

    function setFilter(filter, preserveRecommendation = false) {
      currentFilter = filter;

      document.querySelectorAll(".filter-button").forEach(button => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });

      if (!preserveRecommendation) {
        activeRecommendation = false;
        recommendation = null;
      }

      renderRecipes();
    }

    document.querySelectorAll(".filter-button").forEach(button => {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    });

    searchInput.addEventListener("input", renderRecipes);

    function openModal() {
      modal.classList.add("open");
      typeStep.classList.remove("hidden");
      preferencesStep.classList.add("hidden");
      document.getElementById("modalDescription").textContent =
        "Encontraremos opciones de la carta con alcohol.";
    }

    function closeModal() {
      modal.classList.remove("open");
    }

    document.getElementById("openRecommend").addEventListener("click", openModal);
    document.getElementById("closeModal").addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });

    document.getElementById("continueRecommend").addEventListener("click", () => {
      typeStep.classList.add("hidden");
      preferencesStep.classList.remove("hidden");
      document.getElementById("modalDescription").textContent =
        "Cuéntanos tus preferencias para encontrar opciones con alcohol.";
    });

    document.getElementById("backToType").addEventListener("click", () => {
      preferencesStep.classList.add("hidden");
      typeStep.classList.remove("hidden");
      document.getElementById("modalDescription").textContent =
        "Primero, elige qué tipo de bebida prefieres.";
    });

    document.getElementById("showRecommendations").addEventListener("click", () => {
      recommendation = {
        type: "con",
        flavor: document.getElementById("flavorSelect").value,
        spirit: document.getElementById("spiritSelect").value,
        strength: document.getElementById("strengthSelect").value
      };

      activeRecommendation = true;
      setFilter("con", true);
      closeModal();

      document.getElementById("recipeGrid").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    // Cargar solamente las recetas públicas de Firestore.
    // Nunca se consulta recipesPrivate desde esta página.
    try {
      onSnapshot(
        collection(db, "recipesPublic"),
        snapshot => {
          const loaded = [];

          snapshot.forEach(docSnapshot => {
            const data = docSnapshot.data();
            loaded.push(...expandRecipe(data, docSnapshot.id));
          });

          // Mantener en la carta pública únicamente los 26 cócteles seleccionados.
          // Esto filtra lo que se muestra, sin borrar documentos de Firestore.
          const allowedNames = new Set([
            "daiquiri", "cosmopolitan", "espresso martini", "john collins",
            "margarita", "aperol spritz", "pichuncho", "daiquiri mulato",
            "pisco politan", "espresso rumtini", "phil collins", "margarita blue",
            "spritz sabor", "mojito", "mojito sabor", "caipirinha", "caipiroska",
            "pisco sour", "sour peruano", "bloody mary", "bloody maria",
            "old fashioned", "rum fashioned", "manhattan", "negroni", "americano",
            "painkiller", "pantera rosa", "margarita frozen", "margarita coco azul",
            "paraiso verde", "leche de monja", "matador", "gin basil smash",
            "margarita hawaiana azul", "baileys affogato", "mojito coco", "laguna azul",
            "pitfuto", "piña colada con baileys", "baileys pasión", "púrpura rey",
            "long island iced tea", "machu picchu", "margarita coco",
            "piña colada clásica", "mango colada", "malibú de piña",
            "piña colada de san valentín"
          ]);
          const normalizeRecipeName = value => text(value).trim()
            .toLocaleLowerCase("es")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          const normalizedAllowedNames = new Set([...allowedNames].map(normalizeRecipeName));
          recipes = loaded
            .filter(recipe => normalizedAllowedNames.has(normalizeRecipeName(recipe.name)))
            .map(recipe => {
              // En la carta pública, Manhattan muestra los ingredientes sin cantidades.
              // No modifica Firebase ni las medidas de la receta privada.
              if (text(recipe.name).trim().toLocaleLowerCase("es") !== "manhattan") return recipe;
              return {
                ...recipe,
                ingredients: (recipe.ingredients || []).map(ingredient => ({
                  ...ingredient,
                  amount: "",
                  unit: ""
                }))
              };
            });
          // Completar las fichas públicas que aún no existan en Firestore.
          // Si ya hay una ficha publicada, se conserva la versión de Firestore.
          const pendingRecipes = [
            {
              id: "manhattan", name: "Manhattan", category: "Clásicos",
              type: "con", photo: "",
              story: "Un clásico elegante de whisky y vermut rojo, con un perfil intenso y aromático.",
              ingredients: [
                { name: "Whisky", amount: 60, unit: "ml" },
                { name: "Vermut rojo dulce", amount: 30, unit: "ml" },
                { name: "Amargo aromático", amount: 2, unit: "golpes" },
                { name: "Cereza", amount: 1, unit: "unidad" }
              ],
              flavors: ["intenso", "amargo"], strength: "fuerte", spirit: "whisky", variants: []
            },
            {
              id: "negroni", name: "Negroni", category: "Clásicos",
              type: "con", photo: "",
              story: "Un cóctel italiano de partes iguales, conocido por su equilibrio entre notas amargas, herbales y dulces.",
              ingredients: [
                { name: "Gin", amount: 30, unit: "ml" },
                { name: "Campari", amount: 30, unit: "ml" },
                { name: "Vermut rojo dulce", amount: 30, unit: "ml" },
                { name: "Naranja", amount: 1, unit: "rodaja" }
              ],
              flavors: ["amargo", "herbal"], strength: "fuerte", spirit: "gin", variants: []
            },
            {
              id: "americano", name: "Americano", category: "Clásicos",
              type: "con", photo: "",
              story: "Un aperitivo italiano refrescante que combina amargor, dulzor y soda con una nota cítrica.",
              ingredients: [
                { name: "Campari", amount: 30, unit: "ml" },
                { name: "Vermut rojo dulce", amount: 30, unit: "ml" },
                { name: "Soda", amount: 60, unit: "ml" },
                { name: "Naranja", amount: 1, unit: "rodaja" }
              ],
              flavors: ["amargo", "cítrico"], strength: "medio", spirit: "amaro", variants: []
            },
            {
              id: "pisco-politan", name: "Pisco Politán", category: "Cócteles de autor",
              type: "con", photo: "",
              story: "Cóctel de autor de pisco transparente con triple sec, limón y cranberry.",
              ingredients: [
                { name: "Pisco transparente", amount: 45, unit: "ml" },
                { name: "Triple sec", amount: 30, unit: "ml" },
                { name: "Jugo de limón", amount: 22, unit: "ml" },
                { name: "Jugo de cranberry", amount: 30, unit: "ml" }
              ],
              flavors: ["cítrico", "frutal"], strength: "medio", spirit: "pisco", variants: []
            },
            {
              id: "moscow-mule", name: "Moscow Mule", category: "Clásicos",
              type: "con", photo: "",
              story: "Ficha de carta con cantidades y detalles registrados por la administradora.",
              ingredients: [
                { name: "Vodka", amount: 60, unit: "ml" },
                { name: "Jugo de limón", amount: 30, unit: "ml" },
                { name: "Ginger beer", amount: 200, unit: "ml" }
              ],
              flavors: ["cítrico", "refrescante"], strength: "medio", spirit: "vodka", variants: []
            },
            {
              id: "london-mule", name: "London Mule", category: "Clásicos",
              type: "con", photo: "",
              story: "Ficha de carta con cantidades y detalles registrados por la administradora.",
              ingredients: [
                { name: "Gin London Dry", amount: 60, unit: "ml" },
                { name: "Jugo de limón", amount: 30, unit: "ml" },
                { name: "Ginger beer", amount: 200, unit: "ml" }
              ],
              flavors: ["cítrico", "refrescante"], strength: "medio", spirit: "gin", variants: []
            },
            {
              id: "penicillin", name: "Penicillin", category: "Clásicos",
              type: "con", photo: "",
              story: "Ficha de carta con cantidades y detalles registrados por la administradora.",
              ingredients: [
                { name: "Whisky escocés", amount: 60, unit: "ml" },
                { name: "Jugo de limón", amount: 30, unit: "ml" },
                { name: "Jugo de jengibre o jengibre en trozos", amount: 15, unit: "ml o 3 láminas" },
                { name: "Syrup de miel", amount: 30, unit: "ml" }
              ],
              flavors: ["cítrico", "especiado"], strength: "fuerte", spirit: "whisky", variants: []
            },
            {
              id: "penicilina-pisco", name: "Penicilina (Pisco añejo)", category: "Cócteles de autor",
              type: "con", photo: "",
              story: "Versión con pisco añejo; ficha registrada por la administradora.",
              ingredients: [
                { name: "Pisco añejo", amount: 60, unit: "ml" },
                { name: "Jugo de limón", amount: 30, unit: "ml" },
                { name: "Jugo de jengibre o jengibre en trozos", amount: 15, unit: "ml o 3 láminas" },
                { name: "Syrup de miel", amount: 30, unit: "ml" }
              ],
              flavors: ["cítrico", "especiado"], strength: "fuerte", spirit: "pisco", variants: []
            },
            {
              id: "dry-martini", name: "Dry Martini", category: "Clásicos",
              type: "con", photo: "",
              story: "Ficha de carta con cantidades y detalles registrados por la administradora.",
              ingredients: [
                { name: "Gin London Dry", amount: 60, unit: "ml" },
                { name: "Vermut dry", amount: 10, unit: "ml" }
              ],
              flavors: ["seco", "herbal"], strength: "fuerte", spirit: "gin", variants: []
            },

          ];
          pendingRecipes.forEach(pending => {
            // Mostrar las fichas clásicas elegidas si aún no existe un documento equivalente.
            // No se escribe nada en Firebase automáticamente.
            if (!recipes.some(recipe =>
              normalizeRecipeName(recipe.name) === normalizeRecipeName(pending.name)
            )) {
              recipes.push(pending);
            }
          });

          recipes = recipes.filter(recipe => recipe.type === "con");

          statusBox.textContent = recipes.length
            ? "Carta conectada. Se muestran los cócteles publicados."
            : "Todavía no hay cócteles publicados para mostrar.";

          statusBox.className = recipes.length
            ? "status-box success"
            : "status-box";

          renderRecipes();
        },
        error => {
          console.error("Error al leer la carta pública:", error);

          statusBox.textContent =
            "No pudimos cargar las recetas. Revisa la conexión con Firebase y las reglas de Firestore.";

          statusBox.className = "status-box error";
          recipes = [];
          renderRecipes();
        }
      );
    } catch (error) {
      console.error("No se pudo iniciar Firebase:", error);

      statusBox.textContent =
        "No se pudo conectar con Firebase. Comprueba firebase-config.js y la publicación del sitio.";

      statusBox.className = "status-box error";
      recipes = [];
      renderRecipes();
    }
  </script>
</body>
</html>
